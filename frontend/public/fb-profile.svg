<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="p-bd-bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00875a"/>
      <stop offset="100%" stop-color="#004d38"/>
    </linearGradient>
    <linearGradient id="p-road-g" x1="90" y1="112" x2="90" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2e25"/>
      <stop offset="100%" stop-color="#0d1a14"/>
    </linearGradient>
    <radialGradient id="p-circle-g" cx="45%" cy="42%" r="55%" fx="38%" fy="36%">
      <stop offset="0%" stop-color="#ff4d63"/>
      <stop offset="100%" stop-color="#d41430"/>
    </radialGradient>
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="p-text-fill" gradientUnits="objectBoundingBox" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#eaf6f1"/>
      <stop offset="72%" stop-color="#eaf6f1"/>
      <stop offset="76%" stop-color="#00c489"/>
      <stop offset="100%" stop-color="#F42A41"/>
    </linearGradient>
    <radialGradient id="p-bg-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0a2a1f"/>
      <stop offset="100%" stop-color="#080f0d"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="320" fill="url(#p-bg-glow)"/>

  <!-- Subtle circular border hint (visible when not clipped) -->
  <circle cx="160" cy="160" r="155" fill="none" stroke="#006A4E" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Logo icon scaled 3.75x, centered -->
  <g transform="translate(70, 38) scale(3.75)">
    <!-- Green rounded square -->
    <rect x="1" y="1" width="46" height="46" rx="13" fill="url(#p-bd-bg)"/>
    <rect x="1" y="1" width="46" height="46" rx="13" stroke="#00c47a" stroke-width="0.8" stroke-opacity="0.4" fill="none"/>

    <!-- Neural network nodes -->
    <circle cx="8" cy="10" r="1.5" fill="#00c47a" opacity="0.5"/>
    <circle cx="36" cy="8" r="1.3" fill="#00c47a" opacity="0.4"/>
    <circle cx="40" cy="22" r="1.5" fill="#00c47a" opacity="0.5"/>
    <circle cx="6" cy="24" r="1.2" fill="#00c47a" opacity="0.35"/>

    <!-- Node connection lines -->
    <line x1="8" y1="10" x2="22" y2="14" stroke="#00c47a" stroke-width="0.4" opacity="0.3"/>
    <line x1="36" y1="8" x2="26" y2="14" stroke="#00c47a" stroke-width="0.4" opacity="0.3"/>
    <line x1="40" y1="22" x2="30" y2="20" stroke="#00c47a" stroke-width="0.4" opacity="0.3"/>
    <line x1="6" y1="24" x2="14" y2="20" stroke="#00c47a" stroke-width="0.4" opacity="0.3"/>

    <!-- BD flag red circle -->
    <circle cx="22" cy="20" r="11" fill="url(#p-circle-g)" filter="url(#p-glow)"/>
    <ellipse cx="19" cy="16.5" rx="4.5" ry="2.8" fill="white" opacity="0.12"/>

    <!-- Road perspective -->
    <path d="M8 47 L14 30 L34 30 L40 47 Z" fill="url(#p-road-g)"/>
    <line x1="8" y1="47" x2="14" y2="30" stroke="#2d4a3c" stroke-width="0.6"/>
    <line x1="40" y1="47" x2="34" y2="30" stroke="#2d4a3c" stroke-width="0.6"/>
    <line x1="4" y1="30" x2="44" y2="30" stroke="white" stroke-width="0.35" stroke-opacity="0.18"/>

    <!-- Road dashes -->
    <line x1="24" y1="32.5" x2="24" y2="35" stroke="#fbbf24" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="24" y1="37.5" x2="24" y2="40.5" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="24" y1="43" x2="24" y2="46.5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

    <!-- Bar chart -->
    <rect x="16" y="23" width="2.5" height="4" rx="0.7" fill="white" opacity="0.88"/>
    <rect x="20" y="20.5" width="2.5" height="6.5" rx="0.7" fill="white" opacity="0.88"/>
    <rect x="24" y="17.5" width="2.5" height="9.5" rx="0.7" fill="white" opacity="0.88"/>
  </g>

  <!-- Title text -->
  <text x="160" y="248" text-anchor="middle" font-family="Rajdhani, Inter, sans-serif" font-size="26" font-weight="700" fill="url(#p-text-fill)" letter-spacing="2.5">TRAFFIC INSIGHT BD</text>

  <!-- Tagline -->
  <text x="160" y="272" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#5e8d7e" letter-spacing="2.5">ROAD SAFETY INTELLIGENCE</text>
</svg>
