# ───────────────────────────────────────────────────────────────
# Nginx — Traffic Insight BD production reverse proxy
# Copy to: /etc/nginx/sites-available/trafficinsightbd.com
# Enable:  ln -s /etc/nginx/sites-available/trafficinsightbd.com /etc/nginx/sites-enabled/
# Test:    nginx -t && systemctl reload nginx
# SSL:     certbot --nginx -d trafficinsightbd.org -d www.trafficinsightbd.org
# ───────────────────────────────────────────────────────────────

proxy_cache_path /tmp/nginx_api_cache
    levels=1:2
    keys_zone=api_cache:10m
    max_size=100m
    inactive=5m
    use_temp_path=off;

upstream app_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name trafficinsightbd.org www.trafficinsightbd.org;

    # ── Gzip ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        image/svg+xml;

    # ── Security headers (supplement app-level headers) ─────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ── Static assets (Vite hashed filenames = immutable) ───
    location /assets/ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Service worker + manifest (short cache) ─────────────
    location ~ ^/(sw\.js|manifest\.webmanifest|registerSW\.js) {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── API (cache GET responses for 60s) ───────────────────
    location /api/ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Cache GET responses
        proxy_cache api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET HEAD;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        # Don't cache POST (scrape trigger, etc.)
        proxy_cache_bypass $request_method;
    }

    # ── Everything else (SPA fallback) ──────────────────────
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
