# ───────────────────────────────────────────────────────────────
# Docker Compose — Production
# Usage:  docker compose -f docker-compose.prod.yml up -d --build
# ───────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-insight-prod
    env_file: .env.production
    environment:
      - APP_ENV=production
      - LOG_LEVEL=WARNING
    ports:
      - "80:8000"
    volumes:
      # Persist the database on the host
      - prod-data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/overview"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  prod-data:
    driver: local
